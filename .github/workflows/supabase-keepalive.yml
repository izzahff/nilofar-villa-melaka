name: Supabase keep-alive

# Supabase free projects pause after 7 days without activity.
# This pings the database twice a week so the public calendar never goes dark.
on:
  schedule:
    - cron: '17 1 * * 1,4' # Monday and Thursday, 09:17 Malaysia time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets not set, skipping"; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/get_busy_ranges" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_from":"2026-01-01","p_to":"2026-01-02"}' > /dev/null
          echo "Supabase is awake"
