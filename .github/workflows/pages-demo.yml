name: Deploy demo to GitHub Pages

# Publishes the site in demo mode (no Supabase, data stays in the visitor's
# browser) at https://<user>.github.io/<repo>/ so the owners can try it.
# Manual only. To use it, enable Settings > Pages > Source: GitHub Actions,
# then run it from the Actions tab. Production runs on Cloudflare Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npx vite build --mode demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
