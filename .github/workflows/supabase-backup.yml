name: Supabase weekly backup

# Free Supabase projects have no automatic backups. This dumps the data every
# Sunday and keeps it as a private workflow artifact for 90 days.
on:
  schedule:
    - cron: '43 18 * * 6' # Sunday 02:43 Malaysia time
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "SUPABASE_DB_URL not set, skipping"; exit 0; fi
          mkdir -p backup
          pg_dump "$DATABASE_URL" --data-only --schema=public --no-owner --no-privileges -f backup/nilofar-$(date +%F).sql
          gzip backup/*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: nilofar-backup
          path: backup/
          retention-days: 90
          if-no-files-found: ignore
